name: Revisar AulaReserva

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar archivos frontend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            frontend/index.html
            frontend/app.js
      - name: Comprobar sintaxis JavaScript
        run: node --check frontend/app.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar archivos backend
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: |
            backend/public/index.php
            backend/public/reservas.php
      - name: Comprobar sintaxis PHP
        run: |
          php -l backend/public/index.php
          php -l backend/public/reservas.php

  resultado:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend y backend correctos"