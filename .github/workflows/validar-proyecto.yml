name: Validar proyecto
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mostrar evento
        run: |
          echo "Evento: ${{ github.event_name }}"
      - name: Validar estructura
        id: validar
        uses: ./.github/actions/validar-aulareserva
        with:
          rutas: >-
            README.md
            frontend/index.html
            frontend/app.js
            backend/public/index.php
      - name: Mostrar resultado
        run: |
          echo "Rutas verificadas: ${{ steps.validar.outputs.total }}"
